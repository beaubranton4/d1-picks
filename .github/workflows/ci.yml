name: CI

# The same gate as /kit-preflight: content lint, unit tests, production build,
# then a real `next start` audited like the live site.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build and serve exactly what production serves: unreleased pages 404,
      # robots allows crawling, metadata is indexable.
      VERCEL_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Pipeline unit tests
        run: python -m unittest discover -s pipeline/tests -t .

      # Auto-publish guardrails (CLAUDE.md): ledger append-only against the base
      # branch, every number in every game page traced, daily caps.
      - name: Pipeline guardrails
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            python -m pipeline.run check --base "origin/${{ github.base_ref }}"
          else
            python -m pipeline.run check --base "${{ github.event.before || 'HEAD~1' }}"
          fi

      - run: npm ci

      - name: Kit stamps
        run: node scripts/kit/kit-stamp.mjs

      - name: Content lint
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            npm run lint:content -- --base "origin/${{ github.base_ref }}"
          else
            npm run lint:content
          fi

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start production server
        run: |
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ > /dev/null && exit 0; sleep 1; done
          cat /tmp/next.log; exit 1

      - name: Site audit
        run: node scripts/kit/audit-site.mjs http://localhost:3000

      - name: Prerender check
        run: node scripts/kit/prerender-check.mjs --base http://localhost:3000 --all

      - name: Robots disallows outside production
        run: |
          VERCEL_ENV=preview npx next start -p 3001 > /tmp/next-preview.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3001/robots.txt > /dev/null && break; sleep 1; done
          curl -s http://localhost:3001/robots.txt | tee /dev/stderr | grep -q '^Disallow: /$'
